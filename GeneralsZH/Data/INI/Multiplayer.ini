; GeneralsX @feature Claude 07/11/2026 two more starting-cash choices, $500,000 and $1,000,000 (owner, 07/11 ops msg cb3a: "also add
; 500k and 1m starting"). The lobby sorts the list when it fills the combo (GUIUtil.cpp PopulateStartingCashComboBox), so it
; reads 5k ... 200k, 500k, 1M; 100k-200k come from code (MultiplayerSettings.cpp constructor), these two are data like 5k-50k.
; The amount rides the options string and the replay header as SC=%u (GameInfo.cpp), an UnsignedInt.
; dataID moves (iniCRC): all-players release only.
;
