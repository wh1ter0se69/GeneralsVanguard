; GeneralsX @feature Claude 07/11/2026 TWENTY MORE, indices 12-31, for 32-player matches (owner, 07/11 ops msg 9286: "for the
; 32 game i think the issue is colors"). With twelve, every Random seat past the twelfth got colour slot % 12
; (GameLogic.cpp populateRandomSideAndColor, [GXCAP]): three players per colour, enemies included. Every reader of the
; table loops getNumColors(), so appending is the whole change; file order is the wire index, so 0-11 keep theirs.
; Thirty-two colours that never look alike do not exist in this renderer (infantry keep only hue and saturation): on
; soldiers the closest of these 32 is 8.0 dE00 (SkyBlue/Turquoise, the pair the owner flagged 06/11, is 16.5). Chosen
