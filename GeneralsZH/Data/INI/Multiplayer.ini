; -----------------------------------------------------------------------------
; GeneralsX @feature Claude 13/08/2026 Four more player colours, appended. Twelve total.
;
; Everything above this line is the retail Data\INI\Multiplayer.ini copied out of
; INIZH.big byte for byte. Verify with:
;   head -c 2638 GeneralsZH/Data/INI/Multiplayer.ini | shasum -a 256
;   -> 1f5f0b738ae29aa18c620a0cae29aaef73f8dbb5c710c69cefcf1b4f556beca8
; It has to stay that way: parseMultiplayerColorDefinition appends every block at index
; getNumColors(), so FILE ORDER IS THE WIRE INDEX. That index is what a peer sends in the
; game-options string and what a replay header stores, so reordering or inserting above
; this line silently repaints every existing player and mis-renders every old replay.
;
; WHY FOUR AND NOT EIGHT. Twelve is the proven player ceiling, so a sixteen-colour palette
; bought nothing and cost separation: it forced four extra colours into a hue circle the
; retail eight already fill. The owner's report - "two reds, and a pink/salmon that reads
; as a third red" - was reproduced as a measurement, not taken on faith. Of the twelve
; entries a 12-slot lobby could actually reach, FOUR pairs collided by name (close in hue
; AND close in lightness): Maroon/Rose 3.4 deg, Red/Coral 5.8 deg, Blush/Rose 10.3 deg,
; Red/Maroon 19.9 deg. Every one of them is in the red family. The retail eight have zero
; such pairs. The palette minimum was 17.99 dE00 (Red/Rose) against 21.52 for retail alone.
;
; WHAT THESE FOUR ACHIEVE. Minimum pairwise CIEDE2000 over the twelve is 21.77 in the day
; table and 21.52 in the night table - and both limiting pairs are RETAIL vs RETAIL
; (Gold/Green and Purple/Pink). So is every limiting pair under simulated deuteranopia
; (4.21/4.79, SkyBlue/Pink), protanopia (6.71, Green/Orange) and greyscale (0.17,
; Green/Orange). The appended colours are not the tightest pair in ANY colour space; the
; palette is now capped only by colours EA itself shipped, which is the best a set that
; keeps the retail eight can do. Name collisions: zero.
;
; Distance alone was not enough to get here and that is the main lesson. CIEDE2000 trades
; lightness against hue, so a darker red scores a comfortable pass and is still called
; "red" out loud. The search therefore also enforces a naming rule calibrated on retail -
; two colours may not be within 25 deg of hue AND 22 L* of each other - plus no regression
; against the retail eight under deuteranopia, protanopia or greyscale, INCLUDING between
; two appended colours, which is what caught an earlier Bronze/Forest pair that merged to
; 3.31 dE under protanopia while looking fine to normal vision.
;
; RGBNightColor is set on all four and is NOT optional: MultiplayerColorDefinition's
; constructor seeds both day and night to 0xFFFFFFFF (MultiplayerSettings.cpp:122-129)
; and RGBColor does not write the night value, so an omitted RGBNightColor is a WHITE
; unit tint on every night map. Note the night table is genuinely different, not a copy:
; retail Purple's night value sits at hue 345, inside what the day table alone shows as an
; empty 73 deg gap between Pink and Red. Optimising daylight only walks straight into it.
;
; Full record, including the CIEDE2000 implementation validated against the Sharma/Wu/Dalal
; reference vectors, in docs/WORKDIR/evidence/lobby-colours-12-2026-08-13/.
;
; GeneralsX @tweak Claude 11/10/2026 SET A: Bronze, Forest and Teal (indices 9-11) replaced by Aqua, Rose and Sky.
; The study above scored FLAT RGB swatches. Measured on rendered pixels (docs/WORKDIR/LOBBY_COLOURS_RENDERED.md, 60
; colours x 3 maps x day/night, Mac Mini, the owner's graphics settings) they fail in play: infantry keep only a colour's
; hue (ZHCA remap, VALUE from the art), so Forest IS Green (6 deg) and Bronze IS Orange (3 deg) on every soldier, and
; Teal sits 14 deg from SkyBlue; on vehicles and buildings the colour is a 2-4 px trim, so 22-35 dE00 flat becomes 5-9
; drawn; Bronze is 6.4 dE00 from desert ground. Set A = the best four of 48 rendered candidates with retail's eight
; fixed (exhaustive search), Salmon kept: 4 confusable pairs against 5 (Blue/Pink and Purple/Pink are retail's own).
; Day = night on all three, like the four before them. File order is unchanged, so index 9-11 now name the new
; colours: a player who picked Bronze in an older lobby sees Aqua - a new colour, never another player's. The
; owner chose this set with player numbers as the second channel (11/10/2026); dataID moves, so it ships only in an
; all-players release.
;
; This file is CRC'd into iniCRC -> dataID. It must reach all four platforms in the
; same rollout or peers refuse each other with DATA_DIFFERS.
; -----------------------------------------------------------------------------

; GeneralsX @tweak Claude 16/10/2026 SET R1: indices 8-11 (Salmon, Aqua, Rose, Sky) replaced by Turquoise, Mint, Raspberry and Black.
; Owner, 14/10: "rework the new added colors they are useless and bad" (Rose read as Red on the minimap); 16/10: "r1".
; Chosen by exhaustive search over the 60-colour RENDERED pool (retail eight fixed, ground contrast >= 7.5): worst rendered pair
; 5.3 against Set A's 3.0, 0 name look-alikes against 2, radar dots >= 10 against 0 (player-ui/colors/HANDBACK_colours-rework-1.md).
; Known costs, accepted by the owner: Black (40,40,40) text is hard to read in chat and Black structures are near-invisible at
; night; Turquoise and Mint are two cyan-greens. Day = night on all four. File order is unchanged, so a player who picked
; Salmon/Aqua/Rose/Sky in an older lobby sees a new colour, never another player's. dataID moves (iniCRC): all-players release only.
;
MultiplayerColor ColorTurquoise
  RGBColor = R:0 G:255 B:212
  RGBNightColor = R:0 G:255 B:212
  TooltipName = Color:Turquoise
End

MultiplayerColor ColorMint
